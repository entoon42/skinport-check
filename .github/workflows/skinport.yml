name: Skinport Daily Check

on:
  schedule:
    - cron: "0 20 * * *"          # every day at 20:00
      timezone: "Europe/Berlin"   # local time, daylight saving handled automatically
  workflow_dispatch:              # manual trigger for testing

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests brotli

      - name: Fetch price and send push notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'EOF'
          import os, requests

          ITEM_NAME = "M4A4 | The Coalition (Minimal Wear)"
          CURRENCY = "EUR"

          # Skinport requires Brotli compression for this endpoint
          response = requests.get(
              "https://api.skinport.com/v1/items",
              params={"app_id": 730, "currency": CURRENCY},
              headers={"Accept-Encoding": "br"},
              timeout=60,
          )
          response.raise_for_status()
          item = next((i for i in response.json() if i["market_hash_name"] == ITEM_NAME), None)

          headers = {"Title": "M4A4 | The Coalition (MW)", "Tags": "moneybag"}

          if not item or item.get("min_price") is None:
              message = "No listings on Skinport right now."
          else:
              message = f"Lowest price: {item['min_price']:.2f} {CURRENCY}\n{item['quantity']} listings available"
              if item.get("median_price"):
                  message += f"\nMedian: {item['median_price']:.2f} {CURRENCY}"
              if item.get("item_page"):
                  headers["Click"] = item["item_page"]  # tapping the notification opens Skinport

          print(message)
          requests.post(
              f"https://ntfy.sh/{os.environ['NTFY_TOPIC']}",
              data=message.encode("utf-8"),
              headers=headers,
              timeout=30,
          ).raise_for_status()
          EOF
