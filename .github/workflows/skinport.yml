name: Skinport Daily Check

on:
  schedule:
    - cron: "0 20 * * *"          # every day at 20:00
      timezone: "Europe/Berlin"   # local time, daylight saving handled automatically
  workflow_dispatch:              # manual trigger for testing

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests brotli

      - name: Fetch prices and send push notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'EOF'
          import os, requests

          CURRENCY = "EUR"

          # (short label for buttons, exact Skinport market name)
          ITEMS = [
              ("M4A4", "M4A4 | The Coalition (Minimal Wear)"),
              ("Talon", "★ Talon Knife | Damascus Steel (Field-Tested)"),
          ]

          # Skinport requires Brotli compression for this endpoint
          response = requests.get(
              "https://api.skinport.com/v1/items",
              params={"app_id": 730, "currency": CURRENCY},
              headers={"Accept-Encoding": "br"},
              timeout=60,
          )
          response.raise_for_status()
          data = {i["market_hash_name"]: i for i in response.json()}

          blocks = []
          actions = []
          for label, name in ITEMS:
              item = data.get(name)
              if not item or item.get("min_price") is None:
                  blocks.append(f"{name}\nNo listings right now.")
                  continue

              line = f"Lowest: {item['min_price']:.2f} {CURRENCY}"
              if item.get("median_price"):
                  line += f" | Median: {item['median_price']:.2f} {CURRENCY}"
              line += f"\n{item['quantity']} listings"
              blocks.append(f"{name}\n{line}")

              if item.get("item_page"):
                  actions.append(f"view, Open {label}, {item['item_page']}")

          message = "\n\n".join(blocks)
          print(message)

          headers = {"Title": "Skinport Daily Prices", "Tags": "moneybag"}
          if actions:
              headers["Actions"] = "; ".join(actions)  # one button per item

          requests.post(
              f"https://ntfy.sh/{os.environ['NTFY_TOPIC']}",
              data=message.encode("utf-8"),
              headers=headers,
              timeout=30,
          ).raise_for_status()
          EOF
